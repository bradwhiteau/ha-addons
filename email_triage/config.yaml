name: Email Triage
version: "0.3.0"
slug: email_triage
description: Triages new Gmail with Claude - junk, urgent alerts, bills to Todoist, draft replies.
url: https://github.com/bradwhiteau/ha-addons
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
options:
  dry_run: true
  gmail_address: ""
  gmail_app_password: ""
  anthropic_api_key: ""
  triage_model: claude-haiku-5-5
  reasoning_model: claude-sonnet-5-5
  todoist_api_token: ""
  todoist_bills_project_id: "6hp9Xx2QcMx5pw2h"
  notify_service: mobile_app_ecto_8
  auto_unsubscribe: true
  never_unsubscribe:
    - seek.com.au
  create_drafts: true
  assistant_live: true
  career_enabled: true
  todoist_career_project_id: "6hXwVCJmC9Q236Pg"
  career_reminder_time: "15:00"
  known_google_apps:
    - Untitled project
    - Save FY26 Power and Internet bills
    - Save Carrick Invoices
    - Tidy 2026 Tax Folder
  archive_after_unsubscribe_days: 14
  deliveries_enabled: true
  todoist_deliveries_project_id: "6hph6VpVv6MQJ8q2"
  sweep_minutes: 10
  log_level: info
schema:
  dry_run: bool
  gmail_address: email
  gmail_app_password: password
  anthropic_api_key: password
  triage_model: str
  reasoning_model: str
  todoist_api_token: password
  todoist_bills_project_id: str
  notify_service: str
  sheet_webhook_url: str?
  sheet_webhook_secret: password?
  auto_unsubscribe: bool
  never_unsubscribe:
    - str
  create_drafts: bool
  assistant_live: bool
  career_enabled: bool
  todoist_career_project_id: str
  career_reminder_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  known_google_apps:
    - str
  archive_after_unsubscribe_days: int(0,60)
  deliveries_enabled: bool
  todoist_deliveries_project_id: str
  sweep_minutes: int(5,120)
  log_level: list(debug|info|warning)
